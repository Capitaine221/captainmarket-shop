<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaptainMarket Catalogue — Dashboard</title>
<style>
  :root{
    --bg:#0c0a0b; --bg-elev:#171315; --card:#1d1719; --border:#332a2c;
    --text:#f3efe9; --text-dim:#a89e9a; --accent:#ffffff; --danger:#e0554f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;}
  p.sub{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  main{max-width:560px;margin:0 auto;padding:40px 20px 80px;}
  label{display:block;font-size:13px;color:var(--text-dim);margin:16px 0 6px;}
  input[type="text"],input[type="password"],select{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:14px;
  }
  input[type="file"]{width:100%;color:var(--text-dim);font-size:13px;}
  button{
    font-family:inherit;cursor:pointer;background:var(--accent);color:#000;border:none;
    padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;margin-top:18px;
  }
  button:hover{opacity:.9;}
  button.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  button.danger{background:var(--danger);color:#fff;}
  #login-view, #app-view{display:none;}
  #login-view.visible, #app-view.visible{display:block;}
  .msg{font-size:13px;margin-top:12px;}
  .msg.error{color:var(--danger);}
  .msg.ok{color:#7fd88f;}
  .card-list{margin-top:32px;border-top:1px solid var(--border);padding-top:20px;}
  .extra-item{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);
  }
  .extra-item img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#111;flex:0 0 auto;}
  .extra-item .info{flex:1;min-width:0;}
  .extra-item .info .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .extra-item .info .c{font-size:12px;color:var(--text-dim);}
  .extra-item button{margin:0;padding:6px 12px;font-size:12px;}
  fieldset{border:none;padding:0;margin:0;}
  fieldset:disabled{opacity:.5;}
</style>
</head>
<body>
<main>
  <h1>CaptainMarket Catalogue</h1>
  <p class="sub">Dashboard — produits exclusifs au catalogue (n'affecte pas captainmarket)</p>

  <div id="login-view" class="visible">
    <label for="pw">Mot de passe</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button onclick="login()">Se connecter</button>
    <div id="login-msg" class="msg"></div>
  </div>

  <div id="app-view">
    <fieldset id="form-fieldset">
      <form id="add-form" onsubmit="return addProduct(event)">
        <label for="title">Titre du produit</label>
        <input type="text" id="title" required>

        <label for="category">Catégorie</label>
        <select id="category" required></select>

        <label for="image">Image</label>
        <input type="file" id="image" accept="image/*" required>

        <button type="submit">Ajouter au catalogue</button>
      </form>
    </fieldset>
    <div id="form-msg" class="msg"></div>

    <div class="card-list">
      <label style="margin-top:0">Produits exclusifs au catalogue</label>
      <div id="extra-list"></div>
    </div>
  </div>
</main>

<script>
  const PW_KEY = "captaincatalog_dashboard_pw";

  function api(path, opts = {}) {
    const pw = sessionStorage.getItem(PW_KEY) || "";
    return fetch("/.netlify/functions/" + path, {
      ...opts,
      headers: { ...(opts.headers || {}), "x-catalog-password": pw },
    });
  }

  async function login() {
    const pw = document.getElementById("pw").value;
    sessionStorage.setItem(PW_KEY, pw);
    const msg = document.getElementById("login-msg");
    msg.textContent = "Connexion...";
    msg.className = "msg";
    const res = await api("catalog-categories");
    if (!res.ok) {
      sessionStorage.removeItem(PW_KEY);
      msg.textContent = "Mot de passe incorrect.";
      msg.className = "msg error";
      return;
    }
    const data = await res.json();
    document.getElementById("login-view").classList.remove("visible");
    document.getElementById("app-view").classList.add("visible");
    populateCategories(data.categories);
    renderExtras(data.extras);
  }

  function populateCategories(categories) {
    const select = document.getElementById("category");
    select.innerHTML = categories
      .map((c) => `<option value="${c.slug}" data-label="${c.name}">${c.name}</option>`)
      .join("");
  }

  function renderExtras(extras) {
    const list = document.getElementById("extra-list");
    if (!extras.length) {
      list.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">Aucun produit exclusif pour l\'instant.</p>';
      return;
    }
    const pw = encodeURIComponent(sessionStorage.getItem(PW_KEY) || "");
    list.innerHTML = extras
      .map(
        (p) => `<div class="extra-item">
          <img src="/.netlify/functions/catalog-image?key=${encodeURIComponent(p.imageKey)}&pw=${pw}" alt="">
          <div class="info">
            <div class="t">${p.title}</div>
            <div class="c">${p.categoryLabel}</div>
          </div>
          <button class="danger" onclick="deleteProduct('${p.id}')">Supprimer</button>
        </div>`
      )
      .join("");
  }

  async function addProduct(e) {
    e.preventDefault();
    const fieldset = document.getElementById("form-fieldset");
    const msg = document.getElementById("form-msg");
    const select = document.getElementById("category");
    const selectedOption = select.options[select.selectedIndex];

    const fd = new FormData();
    fd.append("title", document.getElementById("title").value);
    fd.append("categorySlug", select.value);
    fd.append("categoryLabel", selectedOption ? selectedOption.dataset.label : select.value);
    fd.append("image", document.getElementById("image").files[0]);

    fieldset.disabled = true;
    msg.textContent = "Ajout en cours...";
    msg.className = "msg";

    const res = await api("catalog-add-product", { method: "POST", body: fd });
    const data = await res.json();
    fieldset.disabled = false;

    if (!res.ok) {
      msg.textContent = data.error || "Erreur lors de l'ajout.";
      msg.className = "msg error";
      return false;
    }

    msg.textContent = "Ajouté ! Le catalogue va se reconstruire (compte ~1-2 min pour voir le changement en ligne).";
    msg.className = "msg ok";
    document.getElementById("add-form").reset();
    const catRes = await api("catalog-categories");
    const catData = await catRes.json();
    renderExtras(catData.extras);
    return false;
  }

  async function deleteProduct(id) {
    if (!confirm("Supprimer ce produit du catalogue ?")) return;
    const res = await api("catalog-delete-product", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id }),
    });
    if (res.ok) {
      const catRes = await api("catalog-categories");
      const catData = await catRes.json();
      renderExtras(catData.extras);
    }
  }

  // Try to resume a session if the password was already entered this tab.
  if (sessionStorage.getItem(PW_KEY)) {
    login();
    document.getElementById("pw").value = sessionStorage.getItem(PW_KEY);
  }
</script>
</body>
</html>
