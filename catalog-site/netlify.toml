# Config for the SEPARATE "catalogue de secours" Netlify site — same GitHub repo as the
# main store, but deployed as its own site with "Base directory" set to this folder
# (catalog-site) in the Netlify UI, so it never touches the main site's netlify.toml/build.
#
# This site is 100% static (no server code): it regenerates the standalone catalog HTML
# at build time by querying Turso directly, then publishes it. It rebuilds automatically on:
#   - every git push to the repo (new product images, code changes)
#   - a call to this site's Build Hook URL (wired into the admin's product/category actions,
#     see src/app/admin/actions.ts) whenever a product/category changes in the database only
#
# Required env vars on THIS Netlify site (Site settings > Environment variables):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN — same values as the main site (read-only use).
#   CATALOG_DASHBOARD_PASSWORD — shared password for the /dashboard.html mini-admin that
#     lets you add products to THIS catalog only (stored in Netlify Blobs, never touches
#     Turso/captainmarket). Leave unset to disable the dashboard entirely.
#   SELF_BUILD_HOOK_URL — this site's own Build Hook URL (Site settings > Build hooks),
#     so the dashboard can trigger a rebuild after you add/remove a catalog-only product.

[build]
  command = "npm --prefix .. ci && npm --prefix .. run catalog && cp dashboard.html ../catalog-export/dashboard.html"
  publish = "../catalog-export"

[functions]
  directory = "functions"
